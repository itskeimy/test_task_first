services:
  nginx:
    image: nginx:alpine
    container_name: test_task_first_nginx
    restart: always
    ports:
      - "127.0.0.1:8099:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/usr/share/nginx/html/static:ro
      - media_data:/usr/share/nginx/html/media:ro
    depends_on:
      - web

  web:
    image: ${IMAGE_NAME:-ghcr.io/itskeimy/test_task_first:latest}
    container_name: test_task_first_web
    restart: unless-stopped
    expose:
      - "8099"
    environment:
      - PORT=8099
      - ALLOWED_HOSTS=*
      - DEBUG=False
      - PYTHONUNBUFFERED=1
      - DB_NAME=${DB_NAME:-test_task_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - django_static:/app/staticfiles
      - media_data:/app/media

  db:
    image: postgres:17-alpine
    container_name: test_task_first_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-test_task_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    ports:
      - "${DB_PORT:-8195}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-test_task_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  postgres_data:
  app_data:
  django_static:
  media_data:
