# Upstream с постоянным пулом соединений (keepalive)
upstream django_backend {
    server web:8099;
    keepalive 64;
}

# Микрокэширование в оперативной памяти (/dev/shm)
proxy_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=django_cache:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Раздача статики Django напрямую через Nginx с диска
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Раздача медиа-файлов
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Админка без кэширования
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Основной сайт с микрокэшем (2 секунды) и keepalive
    location / {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Микрокэш на 2 секунды
        proxy_cache django_cache;
        proxy_cache_valid 200 302 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        # Заголовок со статусом кэша (HIT / MISS)
        add_header X-Cache-Status $upstream_cache_status;
    }
}
